# Production stack, from the published images. Run it with its own env file:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# DB_PASSWORD must be set in the env file. The web UI is on host port BGCI_WEB_PORT (default 15000).
#
# Each release attaches this file as docker-compose.yml and .env.prod.example as .env.example,
# so end users run a plain `docker compose up -d` with a `.env` file.
name: bgci

services:

  bgci-db:
    image: postgres:17-alpine
    container_name: bgci-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-bgci}
      - POSTGRES_USER=${DB_USER:-bgci}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - bgci-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - bgci-net

  bgci-api:
    image: ghcr.io/dawidvanzyl/bgci-api:latest
    container_name: bgci-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Host=bgci-db
      - Database__Port=5432
      - Database__Name=${DB_NAME:-bgci}
      - Database__User=${DB_USER:-bgci}
      - Database__Password=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - Bgg__BearerToken=${BGG_BEARER_TOKEN:-}
      - Bgg__Username=${BGG_USERNAME:-}
      - BggWriter__BaseUrl=http://bgg-writer:3001
    depends_on:
      bgg-writer:
        condition: service_started
      bgci-db:
        condition: service_healthy
    networks:
      - bgci-net

  bgg-writer:
    image: ghcr.io/dawidvanzyl/bgci-writer:latest
    container_name: bgg-writer
    restart: unless-stopped
    environment:
      - BGG_PASSWORD=${BGG_PASSWORD:-}
      - BGG_BEARER_TOKEN=${BGG_BEARER_TOKEN:-}
      - PORT=3001
    networks:
      - bgci-net

  bgci-web:
    image: ghcr.io/dawidvanzyl/bgci-web:latest
    container_name: bgci-web
    restart: unless-stopped
    ports:
      - "${BGCI_WEB_PORT:-15000}:80"
    depends_on:
      - bgci-api
    networks:
      - bgci-net

volumes:
  bgci-pgdata:
    name: bgci-pgdata

networks:
  bgci-net:
    name: bgci-net
