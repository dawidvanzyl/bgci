# Development and QA stacks, built from source. Production is docker-compose.prod.yml.
#
# Each profile has its own env file. Copy the example, then pass the file to compose:
#   cp .env.qa.example .env.qa
#   cp .env.dev.example .env.dev
#
# The qa profile is the stack the Playwright suite runs against. Its PostgreSQL service keeps
# its data in memory, so every `up` starts with an empty database, and the profile replaces
# BoardGameGeek with e2e/mock-bgg. It also runs the jobs service (Hangfire dashboard) and its own
# jobs database, which keeps its data in memory too. Every value has a default, so
# --env-file is optional for qa:
#   docker compose --env-file .env.qa --profile qa up --build -d
#   docker compose --env-file .env.qa --profile qa down -v
#
# The dev profile runs the real stack against BoardGameGeek: database, API (which serves the web UI), and the jobs
# service with its jobs database (in a named volume). It needs BGG_USERNAME, BGG_PASSWORD and BGG_BEARER_TOKEN in .env.dev. The jobs service uses BGG_PASSWORD to log in to BoardGameGeek, the API never sees it. Its database
# lives in a named volume until the profile is taken down with -v. To run only the database,
# for running the API from source, name the service:
#   docker compose --env-file .env.dev --profile dev up --build -d
#   docker compose --env-file .env.dev --profile dev up -d bgci-dev-db
#   docker compose --env-file .env.dev --profile dev down -v
#
# The two profiles use separate networks and ports, so they can run at the same time. Each env file sets
# COMPOSE_PROJECT_NAME (bgci-qa or bgci-dev), so Docker groups the containers by stack.
#
# Host ports. Each stack has its own block of 100, below the Windows dynamic port range
# (49152 and up), so no port here clashes with Docker's random ports:
#   prod  15000 web UI and API (published, BGCI_WEB_PORT), 15001 api, 15002 db,
#         15003 jobs dashboard (published, 127.0.0.1 only)
#   qa    15100 web UI and API (published), 15101 api, 15102 db, 15103 mock BGG (published),
#         15104 jobs dashboard (published, 127.0.0.1 only)
#   dev   15200 web UI and API (published), 15201 api, 15202 db (published, 127.0.0.1 only),
#         15203 jobs dashboard (published, 127.0.0.1 only)
name: bgci-qa

x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_DB: ${DB_NAME:-bgci}
    POSTGRES_USER: ${DB_USER:-bgci}
    POSTGRES_PASSWORD: ${DB_PASSWORD:-bgci}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

services:
  # ---- qa profile: mock BGG ----

  bgci-db:
    <<: *postgres
    profiles: [qa]
    networks: [qa]
    tmpfs:
      - /var/lib/postgresql/data

  bgci-jobs-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${JOBS_DB_NAME:-bgci_jobs}
      POSTGRES_USER: ${JOBS_DB_USER:-bgci_jobs}
      POSTGRES_PASSWORD: ${JOBS_DB_PASSWORD:-bgci_jobs}
    profiles: [qa]
    networks: [qa]
    tmpfs:
      - /var/lib/postgresql/data

  mock-bgg:
    image: bgci-qa-mock-bgg
    build:
      context: ./e2e/mock-bgg
      additional_contexts:
        test-data: ./test-data
    profiles: [qa]
    networks: [qa]
    environment:
      PUBLIC_BASE_URL: http://localhost:${QA_MOCK_PORT:-15103}
    ports:
      - "${QA_MOCK_PORT:-15103}:4010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4010/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  bgci-api:
    image: bgci-qa-api
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [qa]
    ports:
      - "${QA_WEB_PORT:-15100}:8080"
    networks: [qa]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: bgci-db
      Database__Port: "5432"
      Database__Name: ${DB_NAME:-bgci}
      Database__User: ${DB_USER:-bgci}
      Database__Password: ${DB_PASSWORD:-bgci}
      Bgg__BaseUrl: http://mock-bgg:4010/
      Bgg__BearerToken: qa-token
      Bgg__Username: qa-user
      JobsDatabase__Host: bgci-jobs-db
      JobsDatabase__Port: "5432"
      JobsDatabase__Name: ${JOBS_DB_NAME:-bgci_jobs}
      JobsDatabase__User: ${JOBS_DB_USER:-bgci_jobs}
      JobsDatabase__Password: ${JOBS_DB_PASSWORD:-bgci_jobs}
      APP_VERSION: qa
    depends_on:
      mock-bgg:
        condition: service_healthy
      bgci-db:
        condition: service_healthy
      bgci-jobs-db:
        condition: service_healthy
      bgci-jobs:
        condition: service_started

  bgci-jobs:
    image: bgci-qa-jobs
    build:
      context: .
      dockerfile: Dockerfile.jobs
    profiles: [qa]
    networks: [qa]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JobsDatabase__Host: bgci-jobs-db
      JobsDatabase__Port: "5432"
      JobsDatabase__Name: ${JOBS_DB_NAME:-bgci_jobs}
      JobsDatabase__User: ${JOBS_DB_USER:-bgci_jobs}
      JobsDatabase__Password: ${JOBS_DB_PASSWORD:-bgci_jobs}
      Bgg__BaseUrl: http://mock-bgg:4010/
      Database__Host: bgci-db
      Database__Port: "5432"
      Database__Name: ${DB_NAME:-bgci}
      Database__User: ${DB_USER:-bgci}
      Database__Password: ${DB_PASSWORD:-bgci}
      Bgg__BearerToken: qa-token
      Bgg__Username: qa-user
      Bgg__Password: qa-password
      Jobs__QaResetEnabled: "true"
      Jobs__RetryDelaysSeconds__0: "0"
      Jobs__RetryDelaysSeconds__1: "0"
      Jobs__QueuePollIntervalSeconds: "0.25"
      Jobs__SchedulePollingIntervalSeconds: "0.2"
      Jobs__WaitForEarlierRequestSeconds: "0.5"
    ports:
      - "127.0.0.1:${QA_JOBS_DASHBOARD_PORT:-15104}:8080"
    depends_on:
      bgci-jobs-db:
        condition: service_healthy
      bgci-db:
        condition: service_healthy
      mock-bgg:
        condition: service_healthy

  # ---- dev profile: real BGG ----

  bgci-dev-db:
    <<: *postgres
    profiles: [dev]
    networks: [dev]
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15202}:5432"
    volumes:
      - bgci-dev-data:/var/lib/postgresql/data

  bgci-dev-jobs-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${JOBS_DB_NAME:-bgci_jobs}
      POSTGRES_USER: ${JOBS_DB_USER:-bgci_jobs}
      POSTGRES_PASSWORD: ${JOBS_DB_PASSWORD:-bgci_jobs}
    profiles: [dev]
    networks: [dev]
    volumes:
      - bgci-dev-jobs-data:/var/lib/postgresql/data

  bgci-dev-jobs:
    image: bgci-dev-jobs
    build:
      context: .
      dockerfile: Dockerfile.jobs
    profiles: [dev]
    networks: [dev]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JobsDatabase__Host: bgci-dev-jobs-db
      JobsDatabase__Port: "5432"
      JobsDatabase__Name: ${JOBS_DB_NAME:-bgci_jobs}
      JobsDatabase__User: ${JOBS_DB_USER:-bgci_jobs}
      JobsDatabase__Password: ${JOBS_DB_PASSWORD:-bgci_jobs}
      Database__Host: bgci-dev-db
      Database__Port: "5432"
      Database__Name: ${DB_NAME:-bgci}
      Database__User: ${DB_USER:-bgci}
      Database__Password: ${DB_PASSWORD:-bgci}
      Bgg__BearerToken: ${BGG_BEARER_TOKEN:-}
      Bgg__Username: ${BGG_USERNAME:-}
      Bgg__Password: ${BGG_PASSWORD:-}
      BggTestAccount__Username: ${BGG_TEST_USERNAME:-}
      BggTestAccount__Password: ${BGG_TEST_PASSWORD:-}
      BggTestAccount__BearerToken: ${BGG_TEST_BEARER_TOKEN:-}
      LiveTest__Enabled: "true"
      LiveTest__Schedule: ${BGG_LIVE_TEST_SCHEDULE:-0 3 * * *}
    ports:
      - "127.0.0.1:${DEV_JOBS_DASHBOARD_PORT:-15203}:8080"
    depends_on:
      bgci-dev-jobs-db:
        condition: service_healthy
      bgci-dev-db:
        condition: service_healthy

  bgci-dev-api:
    image: bgci-dev-api
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [dev]
    networks: [dev]
    ports:
      - "${DEV_WEB_PORT:-15200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: bgci-dev-db
      Database__Port: "5432"
      Database__Name: ${DB_NAME:-bgci}
      Database__User: ${DB_USER:-bgci}
      Database__Password: ${DB_PASSWORD:-bgci}
      Bgg__BearerToken: ${BGG_BEARER_TOKEN:-}
      Bgg__Username: ${BGG_USERNAME:-}
      JobsDatabase__Host: bgci-dev-jobs-db
      JobsDatabase__Port: "5432"
      JobsDatabase__Name: ${JOBS_DB_NAME:-bgci_jobs}
      JobsDatabase__User: ${JOBS_DB_USER:-bgci_jobs}
      JobsDatabase__Password: ${JOBS_DB_PASSWORD:-bgci_jobs}
      APP_VERSION: dev
    depends_on:
      bgci-dev-db:
        condition: service_healthy
      bgci-dev-jobs-db:
        condition: service_healthy
      bgci-dev-jobs:
        condition: service_started

networks:
  qa:
  dev:

volumes:
  bgci-dev-data:
  bgci-dev-jobs-data:
